spring.application.name=altermax
server.port=8081

spring.datasource.url=jdbc:h2:mem:altermax;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

springdoc.swagger-ui.path=/swagger-ui.html
server.error.include-stacktrace=never

altermax.jwt.secret=${ALTERMAX_JWT_SECRET:YWx0ZXJtYXgtY2hhdmUtZGVtb25zdHJhY2FvLWFjYWRlbWljYS0yMDI2LXNlZ3VyYQ==}
altermax.jwt.expiration=3600s

altermax.cars-data.base-url=https://api.cars-data.com/v1
altermax.cars-data.api-key=${CARSDATA_API_KEY:}
altermax.cars-data.connect-timeout=3s
altermax.cars-data.read-timeout=8s
